<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TransitTunes — 24/7 Live Bus Radio & Highway Music App</title>
    
    <meta name="description"
      content="TransitTunes is a 24/7 synchronized live bus radio and highway music app for passengers. Enjoy continuous retro music during your journey with Odia, Hindi and English songs." />
    
    <meta name="keywords"
      content="TransitTunes, TransitTunes playlist, bus music, bus playlist, bus songs, Odia songs, Hindi songs, English songs, Odisha bus, music player, bus journey music, continuous music" />
    
    <meta name="author" content="TransitTunes" />
    <meta name="application-name" content="TransitTunes" />

    <!-- Performance Optimizations: Preconnect to Font & Image CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    
    <!-- Google Fonts: Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- PWA & Mobile Web App Capable Meta Tags -->
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TransitTunes" />

    <!-- OpenGraph / Social Sharing Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TransitTunes" />
    <meta property="og:title"
      content="TransitTunes — 24/7 Live Bus Radio & Highway Music App" />
    <meta property="og:description"
      content="Enjoy continuous music throughout your bus journey with TransitTunes. Listen to Odia, Hindi and English songs." />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title"
      content="TransitTunes — 24/7 Live Bus Radio & Highway Music App" />
    <meta name="twitter:description"
      content="Your bus journey, your music. Enjoy continuous Odia, Hindi and English music with TransitTunes." />
      
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans overflow-hidden antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
